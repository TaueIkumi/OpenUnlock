allowBuilds:
  esbuild: true

overrides:
  # sanitize-html@2.17.7 depends on htmlparser2@^12, which dropped its
  # CommonJS build (pure ESM only). sanitize-html itself is CJS and
  # `require()`s htmlparser2 directly, so that combination throws
  # ERR_REQUIRE_ESM on any Node version without require(esm) interop
  # (Node <22, and even 22 without it enabled) — this broke CI on the
  # 18.x/20.x matrix jobs while silently working on newer local Node.
  # 10.1.0 is the newest htmlparser2 that still ships dist/commonjs.
  htmlparser2: 10.1.0
